[workspace]
members = [
    "crates/qalsheet-core",
    "crates/qalsheet-ui",
    "crates/qalsheet-desktop",
    "crates/qalsheet-android",
    "crates/qalsheet-wear",
]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
qalsheet-core = { path = "crates/qalsheet-core" }
qalsheet-ui = { path = "crates/qalsheet-ui" }
eframe = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
    "clipboard",
    "links",
    "android-native-activity",
] }
log = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "none"
